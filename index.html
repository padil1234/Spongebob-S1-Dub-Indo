<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        video {
            width: 100%;
            max-height: 600px;
            background: black;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Video Player</h1>

    <video id="video" controls loop>
        <source src="video.mp4" type="video/mp4">
        Browser kamu tidak mendukung video.
    </video>

    <br>

    <button onclick="openPiP()">
        Picture in Picture
    </button>

</div>

<script>
async function openPiP() {
    const video = document.getElementById("video");

    try {
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        } else {
            await video.requestPictureInPicture();
        }
    } catch (error) {
        console.log(error);
        alert("PiP tidak dapat digunakan.");
    }
}
</script>

</body>
</html>
